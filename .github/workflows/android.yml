
name: Build API Sarubima Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin pip version
        run: |

          python -m pip install pip==23.3.1

          python -m pip --version

      
      - name: Install Buildozer
        run: |
          python -m pip install pip==23.3.1
          python -m pip install buildozer Cython==0.29.33

      
      - name: Build APK
        env:
          PIP_NO_BINARY: "charset-normalizer"
        run: |
          set -o pipefail
          yes | buildozer -v android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: api-sarubima-debug-apk
          path: bin/*.apk

