
name: Build API Sarubima Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer Cython==0.29.33

      - name: Build APK
        run: |

          set -o pipefail

          yes | buildozer -v android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: api-sarubima-debug-apk
          path: bin/*.apk
